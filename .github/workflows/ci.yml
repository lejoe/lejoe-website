name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v4

      - name: Setup node env 🏗
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies 👨🏻‍💻
        run: npm ci

      - name: Generate Nuxt types and ESLint config 🧩
        run: npx nuxt prepare

      - name: Run linter 👀
        run: npm run lint
